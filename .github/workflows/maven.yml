name: Java CI

on:
  push:
    branches:
      - 9.x
      - 10.x
  pull_request:
    branches:
      - 9.x
      - 10.x

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      security-events: write # Required for CodeQL analysis
      actions: read

    steps:
    - uses: actions/checkout@v6.0.2
    - name: Set up JDK 21
      uses: actions/setup-java@v5.2.0
      with:
        distribution: temurin
        java-version: 21
    - name: Cache Maven Dependencies (~/.m2/repository)
      uses: actions/cache@v5.0.4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-:
    - name: Cache NPM Dependencies (core/com.b2international.snowowl.core.rest/snow-owl-api-docs/node_modules)
      uses: actions/cache@v5.0.4
      with:
        path: core/com.b2international.snowowl.core.rest/snow-owl-api-docs/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('core/com.b2international.snowowl.core.rest/snow-owl-api-docs/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-:
    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: java
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        
        # Details on CodeQL's query packs refer to : https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality
    # Run the build
    - name: Build with Maven
      run: ./mvnw -ntp clean verify
    # Upload Code Coverage
    - name: Upload Codecov
      uses: codecov/codecov-action@v5.5.4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
    # Run Code Analysis
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
